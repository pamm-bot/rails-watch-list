<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="premiere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="55%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <clipPath id="board-clip">
      <rect x="88" y="132" width="336" height="256" rx="30" ry="30"/>
    </clipPath>
    <filter id="board-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#premiere)"/>

  <g filter="url(#board-shadow)">
    <g clip-path="url(#board-clip)">
      <rect x="88" y="132" width="336" height="256" fill="#ffffff"/>
      <g fill="#7209b7">
        <polygon points="28,122 84,122 44,228 -12,228"/>
        <polygon points="140,122 196,122 156,228 100,228"/>
        <polygon points="252,122 308,122 268,228 212,228"/>
        <polygon points="364,122 420,122 380,228 324,228"/>
        <polygon points="476,122 532,122 492,228 436,228"/>
      </g>
    </g>
  </g>

  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="122" cy="157" r="9"/>
    <circle cx="390" cy="157" r="9"/>
  </g>
  <g fill="#7209b7">
    <circle cx="122" cy="157" r="4"/>
    <circle cx="390" cy="157" r="4"/>
  </g>
</svg>
